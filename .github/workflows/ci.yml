name: Package checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ai-inspector
    strategy:
      matrix:
        node:
          - 20
          - 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/ai-inspector/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
