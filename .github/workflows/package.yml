name: package

on:
  push:
    paths:
      - "packages/ai-inspector/**"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "packages/ai-inspector/**"
      - ".github/workflows/package.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: packages/ai-inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
